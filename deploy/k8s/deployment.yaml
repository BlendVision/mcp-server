apiVersion: apps/v1
kind: Deployment
metadata:
  name: blendvision-mcp-server
  labels:
    app.kubernetes.io/name: blendvision-mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blendvision-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blendvision-mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/blendvision/mcp-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: BLENDVISION_BASE_URL
              value: https://api.one.blendvision.com
          # No API token here on purpose: the connector reads a token from each
          # request, so the deployment holds no credential of its own.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem is on, and node still wants a writable /tmp.
        - name: tmp
          emptyDir: {}
